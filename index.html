<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FC">
<title>背诵助手</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f5f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
body{min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;background:#f7f8fc;padding-bottom:88px}
.top{padding:18px 18px 8px;position:sticky;top:0;background:rgba(247,248,252,.94);backdrop-filter:blur(14px);z-index:5}
.brand{font-size:13px;color:#7b8496;letter-spacing:.3px}
.title{font-size:27px;font-weight:800;margin:4px 0 2px;letter-spacing:-.6px}
.sub{font-size:13px;color:#7b8496}
.progressWrap{margin-top:14px;background:#fff;border-radius:18px;padding:14px 15px;box-shadow:0 4px 18px rgba(31,42,68,.05)}
.progressLine{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#697386}
.bar{height:7px;background:#edf0f5;border-radius:99px;margin-top:9px;overflow:hidden}
.fill{height:100%;width:0;background:#6c63ff;border-radius:99px;transition:.3s}
.content{padding:10px 18px}
.hero{background:linear-gradient(135deg,#6c63ff,#8b83ff);border-radius:25px;padding:21px;color:white;box-shadow:0 12px 28px rgba(108,99,255,.2);margin:10px 0 17px}
.hero .eyebrow{font-size:12px;opacity:.8}
.hero h2{font-size:23px;margin:5px 0 8px}
.hero p{font-size:13px;line-height:1.7;margin:0;opacity:.92}
.heroActions{display:flex;gap:8px;margin-top:16px}
.heroActions button{flex:1;background:rgba(255,255,255,.16);padding:11px;border-radius:13px;font-weight:700;font-size:13px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}
.sectionTitle h3{margin:0;font-size:16px}
.sectionTitle span{font-size:12px;color:#8992a3}
.articleCard{background:#fff;border-radius:19px;padding:16px;margin-bottom:11px;box-shadow:0 4px 18px rgba(31,42,68,.045);border:1px solid #f0f1f5}
.articleCard .num{font-size:11px;color:#8b83ff;font-weight:800}
.articleCard h4{font-size:17px;margin:4px 0 6px}
.articleCard p{font-size:12px;color:#7a8394;line-height:1.6;margin:0}
.cardBottom{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.miniBar{width:110px;height:6px;background:#eef0f5;border-radius:99px;overflow:hidden}
.miniBar i{display:block;height:100%;background:#6c63ff}
.primary{background:#6c63ff;color:white;padding:10px 15px;border-radius:12px;font-weight:700;font-size:13px}
.secondary{background:#f0efff;color:#5d55dc;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px}
.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid #eceef3;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;z-index:20}
.navBtn{flex:1;text-align:center;color:#8a92a2;font-size:11px}
.navBtn b{display:block;font-size:20px;line-height:22px;margin-bottom:3px;font-weight:500}
.navBtn.active{color:#6259e8;font-weight:700}
.page{display:none}.page.active{display:block}
.back{display:inline-flex;align-items:center;gap:5px;color:#666f80;font-size:13px;padding:4px 0}
.articleHead{padding:12px 0 15px}
.articleHead h2{font-size:25px;margin:9px 0 6px}
.articleHead p{font-size:13px;color:#788194;margin:0;line-height:1.6}
.stepTabs{display:flex;gap:7px;overflow:auto;padding:2px 0 11px;scrollbar-width:none}
.stepTabs::-webkit-scrollbar{display:none}
.step{white-space:nowrap;background:#fff;border:1px solid #eceef4;border-radius:99px;padding:8px 12px;font-size:12px;color:#788194}
.step.on{background:#6c63ff;color:white;border-color:#6c63ff}
.modeIntro{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;border:1px solid #eceef4}
.modeIntro strong{font-size:14px}.modeIntro p{font-size:12px;line-height:1.65;color:#778092;margin:6px 0 0}
.sentence{background:#fff;border-radius:20px;padding:17px;margin:10px 0;border:1px solid #eceef4;box-shadow:0 4px 15px rgba(31,42,68,.04)}
.sentenceTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.badge{font-size:11px;background:#f0efff;color:#5e56df;border-radius:8px;padding:5px 8px;font-weight:700}
.sound{width:34px;height:34px;border-radius:50%;background:#f3f2ff;color:#5d55df;font-size:17px}
.cn{font-size:14px;line-height:1.75;font-weight:700;margin-bottom:11px}
.en{font-size:15px;line-height:1.8;color:#263149}
.en.masked{color:#c5cad4;filter:blur(4px);user-select:none}
.keywords{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.kw{font-size:11px;background:#f5f6f9;color:#5e687b;border-radius:8px;padding:6px 8px}
.hint{margin-top:12px;font-size:12px;color:#7a8495;line-height:1.6}
.sentenceBtns{display:flex;gap:8px;margin-top:13px}
.sentenceBtns button{flex:1;padding:10px;border-radius:11px;font-size:12px;font-weight:700}
.ok{background:#eaf8f1;color:#168653}.retry{background:#f4f5f8;color:#687286}
.bigAction{width:100%;padding:14px;border-radius:15px;background:#6c63ff;color:white;font-weight:800;margin:9px 0 16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{background:#fff;border-radius:16px;padding:13px;text-align:center;border:1px solid #eceef4}
.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#81899a}
.reviewItem{background:#fff;border-radius:17px;padding:15px;margin-bottom:10px;border:1px solid #eceef4}
.reviewItem h4{margin:0 0 5px;font-size:15px}.reviewItem p{margin:0;color:#7b8494;font-size:12px;line-height:1.6}
.empty{padding:45px 15px;text-align:center;color:#8a92a2;font-size:13px}
.tipBox{background:#fff7e7;border:1px solid #f8e2b5;color:#80601c;border-radius:17px;padding:13px;font-size:12px;line-height:1.7;margin-top:13px}
</style>
</head>
<body>
<div class="app">
  <div id="homePage" class="page active">
    <div class="top">
      <div class="brand">孩子的英语背诵助手</div>
      <div class="title">今天背什么？</div>
      <div class="sub">不要硬背，先理解 → 关键词 → 提示 → 脱稿</div>
      <div class="progressWrap">
        <div class="progressLine"><span>今日进度</span><b id="homeProgressText">0%</b></div>
        <div class="bar"><div class="fill" id="homeProgress"></div></div>
      </div>
    </div>
    <div class="content">
      <div class="hero">
        <div class="eyebrow">推荐方法 · 15分钟一轮</div>
        <h2>先把“故事”装进脑子</h2>
        <p>每句话先看中文和关键词，再尝试自己说英文。卡住时只给一个词，不重新从头背。</p>
        <div class="heroActions">
          <button onclick="openArticle(0)">开始第一篇</button>
          <button onclick="startRandom()">随机复习</button>
        </div>
      </div>
      <div class="sectionTitle"><h3>背诵任务</h3><span>共 4 篇</span></div>
      <div id="articleList"></div>
    </div>
  </div>

  <div id="articlePage" class="page">
    <div class="top">
      <button class="back" onclick="goHome()">‹ 返回任务</button>
      <div class="articleHead">
        <div class="brand" id="articleNo">第 1 篇</div>
        <h2 id="articleTitle"></h2>
        <p id="articleDesc"></p>
      </div>
      <div class="stepTabs" id="stepTabs"></div>
    </div>
    <div class="content">
      <div id="modeIntro" class="modeIntro"></div>
      <div id="sentenceList"></div>
      <button id="nextStepBtn" class="bigAction" onclick="nextStep()">完成本轮，进入下一步 →</button>
      <div class="tipBox">小技巧：孩子卡住时，只提示关键词；不要直接把整句告诉他。能自己恢复出来，才算真正背会。</div>
    </div>
  </div>

  <div id="reviewPage" class="page">
    <div class="top">
      <div class="brand">复习中心</div>
      <div class="title">把忘记的再捡回来</div>
      <div class="sub">短时间重复，比一次硬背两小时更有效</div>
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat"><b id="statDone">0</b><span>已掌握句子</span></div>
        <div class="stat"><b id="statRetry">0</b><span>需要复习</span></div>
        <div class="stat"><b id="statArticles">0</b><span>完成文章</span></div>
      </div>
      <div class="sectionTitle"><h3>今天复习</h3></div>
      <div id="reviewList"></div>
    </div>
  </div>

  <div class="bottomNav">
    <button class="navBtn active" id="navHome" onclick="goHome()"><b>⌂</b>任务</button>
    <button class="navBtn" id="navReview" onclick="showReview()"><b>↻</b>复习</button>
  </div>
</div>

<script>

const modeInfo=[
 ["① 理解","先看中文","这一轮不要求背英文。把每一段想成一个故事，知道“发生了什么”。"],
 ["② 关键词","抓住钩子","只看关键词尝试说英文。卡住时，只允许看一个关键词。"],
 ["③ 提示背","逐渐减少提示","看中文 + 关键词，自己恢复完整英文；说出来后再点“会了”。"],
 ["④ 脱稿","真正背诵","中文也逐渐隐藏，只给少量提示，尽量完整说出英文。"],
 ["⑤ 复习","间隔重复","把容易忘的句子重新练一遍，不从头硬背。"]
];

let currentArticle=0,currentStep=0;
let state=JSON.parse(localStorage.getItem("reciteState")||"{}");
if(!state.done) state.done={};
if(!state.retry) state.retry={};

function key(a,s){return a+"_"+s}
function save(){localStorage.setItem("reciteState",JSON.stringify(state));}
function allSentences(){return articles.flatMap((a,ai)=>a.paras.flatMap(p=>p.sentences.map((s,si)=>({a:ai,s:si,data:s}))));}
function articleSentences(ai){return articles[ai].paras.flatMap(p=>p.sentences)}
function renderHome(){
 const total=allSentences().length;
 const done=Object.values(state.done).filter(Boolean).length;
 const pct=Math.round(done/total*100);
 document.getElementById("homeProgress").style.width=pct+"%";
 document.getElementById("homeProgressText").textContent=pct+"%";
 document.getElementById("articleList").innerHTML=articles.map((a,i)=>{
   const ss=articleSentences(i), d=ss.filter((_,s)=>state.done[key(i,s)]).length, p=Math.round(d/ss.length*100);
   return `<div class="articleCard"><div class="num">第 ${i+1} 篇 · ${d}/${ss.length} 句</div><h4>${a.title}</h4><p>${a.desc}</p><div class="cardBottom"><div class="miniBar"><i style="width:${p}%"></i></div><button class="primary" onclick="openArticle(${i})">${p? "继续背":"开始"}</button></div></div>`;
 }).join("");
}
function showPage(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 window.scrollTo(0,0);
}
function setNav(name){
 document.getElementById("navHome").classList.toggle("active",name==="home");
 document.getElementById("navReview").classList.toggle("active",name==="review");
}
function goHome(){renderHome();showPage("homePage");setNav("home")}
function openArticle(i,step=0){currentArticle=i;currentStep=step;renderArticle();showPage("articlePage");setNav("")}
function renderArticle(){
 const a=articles[currentArticle];
 document.getElementById("articleNo").textContent=`第 ${currentArticle+1} 篇 · 共 ${articleSentences(currentArticle).length} 句`;
 document.getElementById("articleTitle").textContent=a.title;
 document.getElementById("articleDesc").textContent=a.desc;
 document.getElementById("stepTabs").innerHTML=modeInfo.map((m,i)=>`<button class="step ${i===currentStep?"on":""}" onclick="setStep(${i})">${m[0]}</button>`).join("");
 document.getElementById("modeIntro").innerHTML=`<strong>${modeInfo[currentStep][0]}：${modeInfo[currentStep][1]}</strong><p>${modeInfo[currentStep][2]}</p>`;
 const ss=articleSentences(currentArticle);
 document.getElementById("sentenceList").innerHTML=ss.map((s,i)=>{
   const isDone=!!state.done[key(currentArticle,i)];
   const showEn=currentStep===0 || currentStep===2 || currentStep===4;
   const mask=currentStep===1 || currentStep===3;
   const showCn=currentStep<4;
   const showKw=currentStep!==4;
   let en=s[0];
   if(currentStep===1) en="";
   return `<div class="sentence">
     <div class="sentenceTop"><span class="badge">句 ${i+1}${isDone?" · 已掌握":""}</span><button class="sound" onclick="speak(decodeURIComponent('${encodeURIComponent(s[0])}'))">▶</button></div>
     ${showCn?`<div class="cn">${s[1]}</div>`:""}
     ${showEn?`<div class="en">${en}</div>`:""}
     ${mask?`<div class="en masked">${s[0]}</div>`:""}
     ${showKw?`<div class="keywords">${s[2].map(k=>`<span class="kw">${k}</span>`).join("")}</div>`:""}
     ${currentStep>0?`<div class="hint">${currentStep===1?"先看关键词，自己说英文。":currentStep===2?"看中文和关键词，完整恢复英文。":currentStep===3?"只看少量提示，尽量脱稿说。":"重点复习这句话。"} </div>`:""}
     <div class="sentenceBtns">
       <button class="retry" onclick="markRetry(${i})">再来一次</button>
       <button class="ok" onclick="markDone(${i})">${isDone?"✓ 已会":"我会了 ✓"}</button>
     </div>
   </div>`;
 }).join("");
 document.getElementById("nextStepBtn").textContent=currentStep<4?"完成本轮，进入下一步 →":"完成复习，返回任务";
}
function setStep(i){currentStep=i;renderArticle();window.scrollTo(0,0)}
function nextStep(){
 if(currentStep<4){currentStep++;renderArticle();window.scrollTo(0,0)}
 else goHome();
}
function markDone(i){state.done[key(currentArticle,i)]=true;save();renderArticle();renderHome()}
function markRetry(i){state.retry[key(currentArticle,i)]=(state.retry[key(currentArticle,i)]||0)+1;state.done[key(currentArticle,i)]=false;save();renderArticle();renderHome()}
function speak(t){
  try{
    if(!("speechSynthesis" in window)){ alert("当前浏览器不支持英文朗读，请使用最新版 Chrome 或 Safari。"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = 0.82;
    u.pitch = 1;
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => /^en(-|_)/i.test(v.lang) && /Google|Microsoft|Samantha|Alex|Daniel|Karen|English/i.test(v.name))
               || voices.find(v => /^en(-|_)/i.test(v.lang));
    if(voice) u.voice = voice;
    u.onerror = () => alert("朗读启动失败，请检查设备音量/静音开关，或换 Chrome / Safari 重试。");
    speechSynthesis.speak(u);
    // Some browsers populate voices asynchronously.
    if(!voice && voices.length === 0){
      setTimeout(() => {
        speechSynthesis.cancel();
        const vs = speechSynthesis.getVoices();
        const v2 = vs.find(v => /^en(-|_)/i.test(v.lang));
        if(v2) u.voice = v2;
        speechSynthesis.speak(u);
      }, 100);
    }
  }catch(e){
    alert("朗读启动失败：" + e.message);
  }
}
if("speechSynthesis" in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
function startRandom(){openArticle(Math.floor(Math.random()*articles.length),1)}
function showReview(){
 const ss=allSentences().filter(x=>!state.done[key(x.a,x.s)]);
 document.getElementById("statDone").textContent=allSentences().filter(x=>state.done[key(x.a,x.s)]).length;
 document.getElementById("statRetry").textContent=Object.values(state.retry).reduce((a,b)=>a+(b||0),0);
 document.getElementById("statArticles").textContent=articles.filter((_,i)=>articleSentences(i).every((_,s)=>state.done[key(i,s)])).length;
 document.getElementById("reviewList").innerHTML=ss.length?ss.slice(0,20).map(x=>`<div class="reviewItem"><h4>${articles[x.a].title} · 第 ${x.s+1} 句</h4><p>${x.data[1]}</p><button class="secondary" style="margin-top:10px" onclick="openArticle(${x.a},3)">开始复习</button></div>`).join(""):`<div class="empty">太棒了！目前没有未掌握的句子。<br>明天再回来复习一遍。</div>`;
 showPage("reviewPage");setNav("review");
}
renderHome();
</script>
